name: Build PS5 RetroArch Title

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PS5_RetroArch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout PS5_PayloadSDK
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_PayloadSDK
          path: PS5_PayloadSDK
          fetch-depth: 0

      - name: Checkout PS5_Vulkan
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          path: PS5_Vulkan
          fetch-depth: 0

      - name: Download PS5 OpenGL SDK Dependency
        run: |
          curl -L -o ps5-opengl-sdk-0.2.0.tar.gz https://github.com/blackbearreloaded/ps5-opengl/releases/download/v0.2.0/ps5-opengl-sdk-0.2.0.tar.gz || \
          curl -L -o ps5-opengl-sdk-0.2.0.tar.gz https://github.com/blackbearreloaded/ps5-opengl/archive/refs/tags/v0.2.0.tar.gz
          mkdir -p ps5-opengl-sdk-0.2.0
          tar -xzf ps5-opengl-sdk-0.2.0.tar.gz -C ps5-opengl-sdk-0.2.0 --strip-components=1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            make \
            python3 \
            python3-pip \
            zip \
            meson \
            ninja-build \
            pkg-config

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install jsonschema

      - name: Build PS5 Vulkan Driver
        run: |
          cd PS5_Vulkan
          chmod +x tools/build-driver.sh tools/setup-native-dependencies.sh
          bash tools/build-driver.sh

      - name: Run Build Title Script
        run: |
          chmod +x tools/build-title.sh tools/setup-native-dependencies.sh
          bash tools/build-title.sh --stage

      - name: Compress Build Artifacts
        run: |
          cd handoff
          zip -r ../PS5_RetroArch_dist.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5_RetroArch_Title
          path: PS5_RetroArch_dist.zip
          retention-days: 14
