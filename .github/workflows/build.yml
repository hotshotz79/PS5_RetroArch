name: Build PS5 RetroArch Title

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PS5_RetroArch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout PS5_Vulkan
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          path: PS5_Vulkan
          fetch-depth: 0

      - name: Checkout PS5 OpenGL SDK Dependency
        uses: actions/checkout@v4
        with:
          repository: blackbearreloaded/ps5-opengl
          path: ps5-opengl-sdk-0.2.0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            make \
            python3 \
            python3-pip \
            zip \
            p7zip-full \
            meson \
            ninja-build \
            pkg-config \
            git

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install jsonschema

      - name: Setup Native Dependencies
        run: |
          chmod +x tools/*.sh
          bash tools/setup-native-dependencies.sh

      - name: Build PS5 Vulkan Driver
        run: |
          cd PS5_Vulkan
          chmod +x tools/*.sh
          bash tools/setup-native-dependencies.sh || true
          bash tools/build-driver.sh

      - name: Run Build Title Script
        run: |
          chmod +x tools/*.sh
          bash tools/build-title.sh --stage

      - name: Compress Build Artifacts
        run: |
          cd handoff
          zip -r ../PS5_RetroArch_dist.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5_RetroArch_Title
          path: PS5_RetroArch_dist.zip
          retention-days: 14
