name: Build PS5 RetroArch Title

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PS5_RetroArch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout PS5_Vulkan Sibling Repository
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          path: PS5_Vulkan

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            make \
            python3 \
            python3-pip \
            zip \
            p7zip-full

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install jsonschema

      - name: Run Build Title Script
        run: |
          chmod +x tools/build-title.sh
          bash tools/build-title.sh --stage

      - name: Compress Build Artifacts
        run: |
          cd handoff
          zip -r ../PS5_RetroArch_dist.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5_RetroArch_Title
          path: PS5_RetroArch_dist.zip
          retention-days: 14
